<style>
:root{color-scheme:dark;--bg:#0b0b12;--card:#161622;--line:#2a2a3d;--text:#f2f2f7;--mute:#9a9ab0;--a:#ff3d81;--b:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(600px 300px at 50% -60px,rgba(124,92,255,.25),transparent),var(--bg);color:var(--text);font-family:"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
.wrap{max-width:600px;margin:0 auto;padding:6px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{background:#00032a;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(124,92,255,.35)}.barin{max-width:600px;margin:0 auto;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.bar .logo{height:40px;width:auto;display:block;border-radius:0;box-shadow:none}.bar .lang{background:rgba(255,255,255,.04)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{background:none;border:0;color:var(--mute);padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--b);color:#fff}
.cb{display:none;margin-top:16px;padding:14px 16px;border-radius:14px;color:#fff;text-decoration:none;background:linear-gradient(90deg,var(--a),var(--b));align-items:center;justify-content:space-between;gap:10px;box-shadow:0 0 0 0 rgba(255,61,129,.6);animation:pulse 2.2s infinite}
.cb.on{display:flex}
.cb b{font-size:15.5px;display:block;line-height:1.35}
.cb span{font-size:12.5px;opacity:.92}
.cb i{font-style:normal;font-size:22px}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,61,129,0)}100%{box-shadow:0 0 0 0 rgba(255,61,129,0)}}
@media (prefers-reduced-motion:reduce){.cb{animation:none}}
h1{font-size:24px;line-height:1.35;margin:22px 0 6px;font-weight:800}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
#q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:13px 14px;outline:none}
#q:focus{border-color:var(--b)}
.chips{display:flex;gap:8px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{border-color:var(--b);color:#fff;background:rgba(124,92,255,.25)}
.cnt{color:var(--mute);font-size:12.5px;margin:8px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:16.5px;line-height:1.45;margin:0 0 8px}
.card p{margin:0;font-size:15px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));border-radius:999px;padding:1px 9px;margin-bottom:8px}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--mute)}
.prod{color:#fff;text-decoration:none;background:linear-gradient(90deg,var(--a),var(--b));border-radius:999px;padding:6px 12px;font-weight:600}
.none{display:none;text-align:center;color:var(--mute);padding:24px 0}
footer{margin-top:26px;color:var(--mute);font-size:11.5px;text-align:center;line-height:1.7}
.lwnote{font-size:12.5px;color:var(--mute);margin:-2px 2px 12px;line-height:1.6}.askhd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.askhd button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}.askbtn.on{background:rgba(124,92,255,.28)}.askbtn{margin:0 0 12px;background:transparent;border:1px solid var(--b);color:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}.askbox{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:16px;margin:10px 0 14px}.askbox h2{font-size:16.5px;margin:0 0 4px}.askbox p{margin:0 0 10px;font-size:13px;color:var(--mute)}.askbox textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:12px;outline:none}.askbox textarea:focus{border-color:var(--b)}.askrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--mute)}.askrow button{border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b))}.askrow button:disabled{opacity:.5}.askmsg{margin-top:10px;font-size:13.5px;color:#9be7b0}.askmsg.err{color:#ff8fa8}.wkh{margin:16px 2px 8px;font-size:13px;font-weight:600;color:var(--mute)}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:9999;display:grid;place-items:center;background:#00032a;overflow:hidden;transition:opacity .45s ease,visibility .45s}#splash::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 42%,rgba(124,92,255,.32),rgba(0,3,42,0) 62%)}.sp-box{position:relative}#splash.hide{opacity:0;visibility:hidden}#splash.go{transition-duration:.2s}.nosplash #splash:not(.go){opacity:0;visibility:hidden;transition:none}.tin #splash{transition-duration:.25s}.sp-box{display:flex;flex-direction:column;align-items:center}.sp-box .lg{width:96px;height:96px;border-radius:24px;box-shadow:0 0 48px rgba(124,92,255,.65);animation:sp-in .8s cubic-bezier(.2,.9,.3,1.2) both}#splash.go .lg{animation-duration:.45s}.tin .sp-box .lg{animation:none}.sp-name{margin-top:18px;color:#f2f2f7;font-weight:800;letter-spacing:.5px;font-size:18px;opacity:0;animation:sp-fade .5s ease .4s forwards}.tin .sp-name{animation:none;opacity:1}@keyframes sp-in{0%{opacity:0;transform:scale(.4) rotate(-14deg)}60%{opacity:1;transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes sp-fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.sp-box .lg,.sp-name{animation:none;opacity:1}}
</style>
</head>

var QA = [{"c": "v", "q": ["জাপান বা অস্ট্রেলিয়ায় কি গেমটি সেন্সর হচ্ছে?", "Is the game censored in Japan or Australia?"], "a": ["প্রি-লোড ফাইলের আকার অঞ্চলভেদে আলাদা দেখে এ নিয়ে জল্পনা ছড়িয়েছে। রকস্টার ও Take-Two এখনো ব্যাখ্যা দেয়নি, তাই এটা এখনো অপ্রমাণিত গুজব।", "Differences in regional preload file sizes sparked speculation. Rockstar and Take-Two have not explained, so it remains an unproven rumour."]}, {"c": "v", "q": ["বক্সড কপিতে ডিস্ক নেই, এটা নিয়ে এত হইচই কেন?", "Why the uproar over no disc in the box?"], "a": ["রকস্টার জানিয়েছে বক্সড কপিতে ডিস্ক থাকবে না, শুধু ডিজিটাল ডাউনলোডের কোড থাকবে। অনেক ফ্যান ব্যাপারটা পছন্দ করেননি, কারণ কোড রিডিম করার পর ডিস্কের মতো ধার বা বিক্রি করা যায় না। কিছু গুজবে পরে ডিস্ক সংস্করণের কথা এসেছে, তবে তা নিশ্চিত নয়।", "Rockstar confirmed boxed copies contain only a digital download code, no disc. Many fans disliked it because a redeemed code cannot be lent or resold like a disc. Rumours of a later disc release exist but are unconfirmed."]}, {"c": "v", "q": ["ম্যাপ কত বড়?", "How big is the map?"], "a": ["রকস্টার জানিয়েছে লিওনিডার ম্যাপ GTA V-এর প্রায় দ্বিগুণ। প্রিভিউ অনুযায়ী ভাইস সিটি একাই লস সান্তোসের প্রায় দ্বিগুণ। বর্গকিলোমিটারে সঠিক মাপ দেওয়া হয়নি।", "Rockstar says the Leonida map is about twice the size of GTA V’s. Previews say Vice City alone is about twice Los Santos. No exact figure in square kilometres was given."]}, {"c": "v", "q": ["GTA Online কি লঞ্চে আছে?", "Is GTA Online in the launch game?"], "a": ["না, লঞ্চে গেমটি সিঙ্গেল-প্লেয়ার অভিজ্ঞতা। নতুন অনলাইনের তারিখ বা দাম জানানো হয়নি। কিছু ইন্ডাস্ট্রি মন্তব্যে ২০২৭ সালের কথা এসেছে, তবে সেটা রকস্টারের ঘোষণা নয়।", "No, launch is a single-player experience. No date or price for a new online mode has been given. Some industry comments mention 2027, but that is not a Rockstar announcement."]}, {"c": "v", "q": ["৬০ এফপিএসে চলবে কি?", "Will it run at 60 FPS?"], "a": ["না। রকস্টার সব কনসোলে (PS5, PS5 Pro, Xbox Series X|S) ৩০ এফপিএস লক্ষ্য রেখেছে, আর ৬০ এফপিএস বা পারফরম্যান্স মোড নেই। রকস্টারের মতে PS5 Pro-ও ৬০ এফপিএসের জন্য যথেষ্ট শক্তিশালী নয়।", "No. Rockstar targets 30 FPS on all consoles (PS5, PS5 Pro, Xbox Series X|S) and there is no 60 FPS or performance mode. Rockstar says even the PS5 Pro is not powerful enough for 60 FPS."]}, {"c": "v", "q": ["পিসিতে কবে আসবে?", "When is the PC version coming?"], "a": ["রকস্টার জানিয়েছে পিসি সংস্করণ পরে আসবে, কিন্তু কোনো তারিখ দেয়নি। ২০২৭ সালের শুরুর কথা একটি রিপোর্টে এসেছে, যা নিশ্চিত নয়।", "Rockstar says a PC version is coming later but gave no date. One report mentions early 2027, which is unconfirmed."]}, {"c": "v", "q": ["ট্রেলারের রেকর্ড ভিউ কত ছিল?", "How big was the trailer launch?"], "a": ["রিপোর্ট অনুযায়ী প্রথম ট্রেলার অনলাইনে আসার একদিনেই প্রায় ৯ কোটি মানুষ দেখেছে, যা ভিডিও গেমের ট্রেলারের জন্য বিশাল রেকর্ড।", "Reports say the first trailer drew around 90 million views in a single day, a huge record for a game trailer."]}, {"c": "v", "q": ["ইমপোর্ট করা PS5 কোড কি আমার অ্যাকাউন্টে চলবে? (রিজিয়ন-লক)", "Will an imported PS5 code work on my account? (region lock)"], "a": ["রকস্টার সাপোর্টের তথ্য অনুযায়ী PS5-এর বক্সড কোড অঞ্চল-লক করা: কোডের অঞ্চল আর আপনার PSN অ্যাকাউন্টের অঞ্চল মিলতে হবে। Xbox কোড অঞ্চলভেদে চলে। তাই বিদেশ থেকে কোড আনার আগে অঞ্চল মিলিয়ে নিন।", "Per Rockstar Support, PS5 boxed codes are region-locked: the code’s region must match your PSN account’s region. Xbox codes work in any region. Check the region before importing a code."]}, {"c": "v", "q": ["গেমটিতে কি মাইক্রোট্রান্সঅ্যাকশন থাকবে?", "Will the game have microtransactions?"], "a": ["রিপোর্ট অনুযায়ী লঞ্চের সিঙ্গেল-প্লেয়ার অংশে মাইক্রোট্রান্সঅ্যাকশন নেই। অনলাইন অংশ নিয়ে এখনো কিছু নিশ্চিত নয়।", "Reports say the single-player launch has no microtransactions. Nothing is confirmed yet for the online part."]}, {"c": "v", "q": ["GTA VI কত ঘণ্টার গেম?", "How long is GTA VI?"], "a": ["রকস্টারের হিসাবে ঐচ্ছিক মিশনসহ গল্প প্রায় ৮০ ঘণ্টা। রিভিউয়ারদের সময় প্রায় ৪০ থেকে ৭০ ঘণ্টার মধ্যে, খেলার ধরনে বদলায়।", "Rockstar puts the story at about 80 hours with optional missions. Reviewers report roughly 40 to 70 hours, depending on play style."]}, {"c": "v", "q": ["PS5-এর দাম কেন বাড়ল?", "Why did PS5 prices go up?"], "a": ["রিপোর্ট অনুযায়ী ২০২৬ সালে যুক্তরাষ্ট্রসহ বিভিন্ন বাজারে PS5-এর দাম বেড়েছে (যেমন যুক্তরাষ্ট্রে PS5 ৬৪৯.৯৯ ও PS5 Pro ৮৯৯.৯৯ ডলার)। বাংলাদেশে দাম আলাদা, তাই কেনার আগে স্থানীয় দাম দেখুন।", "Reports say PS5 prices rose in several markets in 2026 (in the US the PS5 is $649.99 and the PS5 Pro $899.99). Bangladesh prices differ, so check local prices before buying."]}, {"c": "v", "q": ["Xbox Series S-এ কি চলবে? জায়গায় কুলাবে?", "Will it run on Xbox Series S? Is there enough space?"], "a": ["হ্যাঁ, Xbox Series X|S-এর জন্য ঘোষিত। তবে Series S-এ ব্যবহারযোগ্য জায়গা প্রায় ৩৬৪ জিবি, তাই ২১২ জিবির গেমটা নিলে প্রায় অর্ধেক জায়গা চলে যাবে। অন্য গেম মুছতে হতে পারে।", "Yes, it is announced for Xbox Series X|S. But a Series S has about 364 GB usable, so a 212 GB game takes over half. You may need to delete other games."]}, {"c": "l", "q": ["GTA VI কবে রিলিজ হয়েছে?", "When did GTA VI release?"], "a": ["১৯ নভেম্বর ২০২৬-এ PS5 ও Xbox Series X|S-এ। রিপোর্ট অনুযায়ী গেম স্থানীয় মধ্যরাতে আনলক হয়েছে, তাই টাইমজোন অনুযায়ী কোথাও আগে, কোথাও পরে খেলা শুরু হয়েছে।", "On 19 November 2026 on PS5 and Xbox Series X|S. Reports say it unlocked at local midnight, so some regions started earlier than others."]}, {"c": "l", "q": ["কোন কোন ডিভাইসে খেলা যাবে?", "Which platforms can play it?"], "a": ["প্লেস্টেশন ৫ এবং Xbox Series X|S-এ। পিসি, PS4 বা Xbox One-এর জন্য এখনো কোনো ঘোষণা আসেনি।", "PlayStation 5 and Xbox Series X|S. No PC, PS4 or Xbox One version has been announced."]}, {"c": "l", "q": ["মোবাইলে চলবে কি?", "Will it run on mobile?"], "a": ["না। লঞ্চে গেমটি শুধু PS5 ও Xbox Series X|S-এর জন্য। মোবাইল সংস্করণের কোনো ঘোষণা নেই, তাই “মোবাইল GTA VI” নামের অ্যাপ বা এপিকে থেকে সাবধান।", "No. At launch it is only for PS5 and Xbox Series X|S. No mobile version has been announced, so beware of apps or APKs claiming to be “GTA VI mobile”."]}, {"c": "l", "q": ["প্রি-লোড কীভাবে করব?", "How do I preload?"], "a": ["ডিজিটাল কপি কিনে থাকলে স্টোরের ডাউনলোড সেকশনে গিয়ে ডাউনলোড চালু করুন। বক্সড কপির কোড স্টোরে রিডিম করলেও ডিজিটাল ভার্সন প্রি-লোড করা যায়। রিপোর্ট অনুযায়ী প্রি-লোড ইতিমধ্যে চালু।", "If you bought digitally, start the download from your store’s downloads section. A boxed copy’s code can also be redeemed to preload the digital version. Reports say preload is already open."]}, {"c": "l", "q": ["লঞ্চের আগে কী প্রস্তুতি নেব?", "What should I prepare before launch?"], "a": ["স্টোরেজ ফাঁকা রাখুন, গেম প্রি-লোড করুন, কন্ট্রোলার চার্জ দিন, ইন্টারনেট ঠিক আছে কি না দেখুন। কাউন্টডাউন পেজের চেকলিস্টটা কাজে লাগবে।", "Free up storage, preload the game, charge your controller and check your internet. The checklist on our countdown page helps."]}, {"c": "l", "q": ["গেমটি কি আবার পিছিয়েছিল?", "Did the game slip again?"], "a": ["গেমটি আগে দুবার পিছিয়েছিল: ২০২৫ থেকে ২৬ মে ২০২৬, তারপর ১৯ নভেম্বর ২০২৬-এ। শেষ ঘোষিত তারিখেই এটি বাজারে এসেছে।", "It slipped twice before: from 2025 to 26 May 2026, then to 19 November 2026. It launched on that final announced date."]}, {"c": "l", "q": ["প্রি-লোড করলেও কি ১৯ তারিখের আগে খেলা যাবে?", "Can I play before the 19th if I preload?"], "a": ["না। প্রি-লোড মানে শুধু আগে ডাউনলোড করে রাখা। গেম আনলক হয় লঞ্চের সময়ে। এটাই প্রি-লোডের উদ্দেশ্য, যাতে লঞ্চের রাতে ডাউনলোডের জন্য বসে থাকতে না হয়।", "No. Preloading only downloads the game early. It unlocks at launch time, so you do not wait on a download on launch night."]}, {"c": "l", "q": ["প্রি-লোডের জন্য কনসোলে কী সেটিং দেব?", "What console settings help preloading?"], "a": ["রিপোর্ট অনুযায়ী PS5-এ অটোমেটিক ডাউনলোড চালু রাখুন, আর কনসোল চালু বা রেস্ট মোডে রাখুন। ডাউনলোড চলার সময় কনসোল বন্ধ করবেন না।", "Reports say keep automatic downloads on and leave the console powered on or in Rest Mode. Do not switch it off mid-download."]}, {"c": "l", "q": ["গেমের বয়স-রেটিং কত?", "What is the age rating?"], "a": ["একটি রিপোর্ট অনুযায়ী যুক্তরাষ্ট্রের ESRB থেকে M (১৭+) রেটিং পেয়েছে। এটা প্রাপ্তবয়স্কদের জন্য, তাই ছোটদের খেলতে দেওয়ার আগে ভেবে দেখুন।", "One report says it got an ESRB M (17+) rating. It is for adults, so think carefully before letting children play."]}, {"c": "g", "q": ["প্রধান চরিত্র কারা?", "Who are the main characters?"], "a": ["জেসন ডুভাল ও লুসিয়া কামিনোস, দুজনই খেলার যোগ্য। রিপোর্ট অনুযায়ী মূল সিরিজে এই প্রথম একজন নারী চরিত্র বাধ্যতামূলক প্রধান চরিত্র।", "Jason Duval and Lucia Caminos, both playable. Reports say Lucia is the first non-optional female lead in a mainline GTA."]}, {"c": "g", "q": ["গেমটি কোথায় সেট করা?", "Where is the game set?"], "a": ["লিওনিডা নামের কাল্পনিক রাজ্যে, যেখানে আধুনিক ভাইস সিটি ফিরেছে। রাজ্যটি ফ্লোরিডা থেকে অনুপ্রাণিত বলে ধরা হয়।", "In the fictional state of Leonida, with a modern Vice City returning. It is widely seen as inspired by Florida."]}, {"c": "g", "q": ["হিট সিস্টেম কী?", "What is the Heat system?"], "a": ["রিপোর্ট অনুযায়ী এটা পুলিশ আপনার সম্পর্কে ঠিক কী জানে তা ট্র্যাক করে, যেমন আপনার পোশাক, চেহারা ও গাড়ি। তাই শুধু তারকা চিহ্নের হিসাবে নয়, আপনার পরিচয়ও পুলিশের কাছে গুরুত্বপূর্ণ হবে।", "Reports say it tracks what police actually know about you, such as your clothes, face and vehicle. So your identity matters, not just the star meter."]}, {"c": "g", "q": ["ওয়ান্টেড সিস্টেম কি বদলেছে?", "Has the wanted system changed?"], "a": ["প্রিভিউ অনুযায়ী অপরাধ করলেই আর স্বয়ংক্রিয়ভাবে ওয়ান্টেড হয় না, সাক্ষী, অ্যালার্ম বা ট্র্যাকারের মতো কিছু লাগে। পুলিশকেও আগে ঘটনাস্থলে পৌঁছাতে হয়।", "Previews say a crime no longer triggers a wanted level automatically; it needs a witness, an alarm or a tracker. Police also have to physically arrive first."]}, {"c": "g", "q": ["বিল্ডিংয়ের ভেতরে কতটা ঢোকা যাবে?", "How many interiors can you enter?"], "a": ["প্রিভিউ অনুযায়ী আগের যেকোনো রকস্টার গেমের চেয়ে অনেক বেশি ইন্টেরিয়র আছে। সঠিক সংখ্যা নিয়ে রিপোর্টে অমিল আছে, তাই নির্দিষ্ট সংখ্যা ধরে নেবেন না।", "Previews say far more interiors than any earlier Rockstar game. Reports disagree on exact numbers, so do not rely on a specific figure."]}, {"c": "g", "q": ["ফার্স্ট-পারসন ভিউ আছে কি?", "Is there a first-person view?"], "a": ["একটি রিপোর্ট অনুযায়ী লঞ্চে পূর্ণ ফার্স্ট-পারসন মোড নেই। আমরা রকস্টারের অফিশিয়াল তালিকায় এটা যাচাই করতে পারিনি।", "One report says there is no full first-person mode at launch. We could not verify this in an official Rockstar list."]}, {"c": "g", "q": ["অটো-এইম কি ডিফল্টে চালু?", "Is auto-aim on by default?"], "a": ["রিপোর্ট অনুযায়ী না। ডিফল্টে ক্লাসিক অটো-এইম বন্ধ থাকে, আর এইমিং সিস্টেম নিজের পছন্দমতো কাস্টমাইজ করা যায়।", "Reportedly no. Classic auto-aim is off by default and aiming can be customised."]}, {"c": "g", "q": ["জেসন ও লুসিয়ার সম্পর্ক কি গেমপ্লেতে সুবিধা দেয়?", "Do Jason and Lucia’s relationships give gameplay perks?"], "a": ["প্রিভিউ অনুযায়ী বন্ধুত্ব বা সম্পর্কে গেমপ্লেতে সরাসরি সুবিধা নেই, তবে গল্পে প্রভাব ফেলতে পারে।", "Per previews, friendships and relationships give no direct gameplay benefits, but can affect the story."]}, {"c": "g", "q": ["গাড়ি ও যানবাহন কতগুলো?", "How many vehicles are there?"], "a": ["একটি রিপোর্ট অনুযায়ী ২০০-র বেশি যান আছে, যার মধ্যে গাড়ি, মোটরবাইক, হেলিকপ্টার, প্লেন ও নৌকা। রকস্টারের নিজের সংখ্যা আমরা যাচাই করতে পারিনি।", "One report says over 200 vehicles including cars, motorbikes, helicopters, planes and boats. We could not verify a number from Rockstar itself."]}, {"c": "g", "q": ["আবহাওয়া ও ঝড় কেমন হবে?", "What about weather and storms?"], "a": ["রিপোর্ট অনুযায়ী গেমে গতিশীল ট্রপিক্যাল ঝড় ও হারিকেন আছে, যা ফ্লোরিডা-অনুপ্রাণিত সেটিংয়ের সাথে মেলে।", "Reports say the game has dynamic tropical storms and hurricanes, fitting the Florida-inspired setting."]}, {"c": "g", "q": ["“এক্সটেন্ডেড লুক” কী?", "What is the “Extended Look”?"], "a": ["২৭ আগস্ট প্রকাশিত ২৬ মিনিটের গেমপ্লে উপস্থাপনা, যা Netflix ও রকস্টারের YouTube চ্যানেলে আছে। রিপোর্ট অনুযায়ী ফুটেজ PS5 থেকে নেওয়া।", "A 26-minute gameplay presentation released on 27 August, available on Netflix and Rockstar’s YouTube channel. Reports say the footage was captured on PS5."]}, {"c": "g", "q": ["গেমের সোশ্যাল মিডিয়া ফিচার কী?", "What is the in-game social media?"], "a": ["প্রিভিউ অনুযায়ী ফোনে সোশ্যাল মিডিয়ার লাইভস্ট্রিম দেখা যায়, আর ঘটনাটা যেখানে ঘটছে সেখানে গিয়ে স্ট্রিমারকে সরাসরি খুঁজে পাওয়া যায়।", "Previews say you can watch livestreams on your phone and travel to where it is happening to find the streamer in person."]}, {"c": "g", "q": ["জেসন ও লুসিয়ার মধ্যে কীভাবে সুইচ করব?", "How do I switch between Jason and Lucia?"], "a": ["Game Informer-এর তথ্য অনুযায়ী খোলা জগতে যেকোনো সময় এবং গল্পের নির্দিষ্ট জায়গায় দুই চরিত্রের মধ্যে দ্রুত সুইচ করা যায়।", "Per Game Informer you can switch quickly between the two at any time in the open world and at set points in the story."]}, {"c": "g", "q": ["গেমে কত প্রজাতির প্রাণী আছে?", "How many animal species are in the game?"], "a": ["Game Informer অনুযায়ী ১৭০-র বেশি প্রজাতি, যেমন ফ্লেমিংগো, অ্যালিগেটর, পেলিকান ও ম্যানাটি।", "Over 170 species per Game Informer, including flamingos, alligators, pelicans and manatees."]}, {"c": "g", "q": ["রেডিও স্টেশন কয়টি, কী ধরনের?", "How many radio stations, and what kinds?"], "a": ["রকস্টার ৮ অক্টোবর ছয়টি স্টেশন প্রকাশ করেছে: পপ, মেটাল, কান্ট্রি, ল্যাটিন, আফ্রিকান ও সাউদার্ন হিপ-হপ। বাকি স্টেশন ও গানের তালিকা লঞ্চের পরে জানানোর কথা রিপোর্টে আছে।", "Rockstar revealed six stations on 8 October: pop, metal, country, Latin, African and southern hip-hop. Reports say the full list comes at launch."]}, {"c": "g", "q": ["গেমে কি পডকাস্ট আছে? হাঁটার সময় গান শোনা যাবে?", "Are there podcasts? Can I listen on foot?"], "a": ["হ্যাঁ। রকস্টারের ঘোষণা অনুযায়ী সিরিজে প্রথমবার অন-ডিমান্ড পডকাস্ট আছে, আর চরিত্রের ফোন ও ইয়ারবাডের মাধ্যমে গাড়ির বাইরেও রেডিও ও পডকাস্ট শোনা যাবে।", "Yes. Rockstar says on-demand podcasts are a series first, and radio and podcasts can be played outside vehicles via the character’s phone and earbuds."]}, {"c": "g", "q": ["অফিশিয়াল সাউন্ডট্র্যাক অ্যালবাম আছে কি?", "Is there an official soundtrack album?"], "a": ["হ্যাঁ, রকস্টার একটি অফিশিয়াল অ্যালবাম নিশ্চিত করেছে। একটি রিপোর্টে ৩৪টি ট্র্যাকের কথা আছে, তবে পুরো তালিকা লঞ্চের সময় জানানোর কথা।", "Yes, Rockstar confirmed an official album. One report mentions 34 tracks, but the full list is due at launch."]}, {"c": "g", "q": ["লড়াই ও স্টেলথে নতুন কী আছে?", "What is new in combat and stealth?"], "a": ["একটি রিপোর্টে পেটের ওপর ভর দিয়ে এগোনো, জিপ-টাই ও হিউম্যান শিল্ডের মতো নতুন মুভের কথা আছে। অফিশিয়াল তালিকা নয়, তাই লঞ্চের পর যাচাই করে নিন।", "One report lists new moves such as prone crawling, zip ties and human shields. It is not an official list, so verify after launch."]}, {"c": "b", "q": ["দাম কত?", "How much does it cost?"], "a": ["রকস্টারের ঘোষণা অনুযায়ী স্ট্যান্ডার্ড এডিশনের দাম ৭৯.৯৯ মার্কিন ডলার। বাংলাদেশ বা অন্য অঞ্চলের স্টোরে দাম ও মুদ্রা আলাদা হতে পারে, কেনার আগে নিজের স্টোরে দেখে নিন।", "Standard Edition is US$79.99 per Rockstar’s announcement. Prices and currency differ by regional store, so check yours before buying."]}, {"c": "b", "q": ["কয়টি এডিশন, পার্থক্য কী?", "How many editions, and what differs?"], "a": ["দুটি: স্ট্যান্ডার্ড ও আল্টিমেট। আল্টিমেটে গাড়ি, অস্ত্র ও পোশাকের মতো বাড়তি আপগ্রেড প্যাক আছে।", "Two: Standard and Ultimate. Ultimate adds an upgrade pack with extras such as vehicles, weapons and outfits."]}, {"c": "b", "q": ["আল্টিমেট এডিশনের দাম কত?", "How much is the Ultimate Edition?"], "a": ["একটি রিপোর্ট অনুযায়ী ৯৯.৯৯ মার্কিন ডলার। আমরা এটা রকস্টারের নিজের সূত্র থেকে নিশ্চিত করতে পারিনি, তাই কেনার আগে স্টোরে দেখে নিন।", "One report says US$99.99. We could not confirm it from Rockstar directly, so check your store before buying."]}, {"c": "b", "q": ["Vintage Vice City Pack কী?", "What is the Vintage Vice City Pack?"], "a": ["প্রি-অর্ডার বোনাস। রিপোর্ট অনুযায়ী এতে আছে ১৯৫৫ সালের একটি Vapid Stanier ও গ্যারেজ, ভিন্টেজ পোশাক ও হেয়ারস্টাইল, আর অস্ত্রের বিশেষ ফিনিশ। ২০ নভেম্বরের আগে কিনলে পাওয়া যায়।", "The pre-order bonus. Reports list a 1955 Vapid Stanier with a garage, vintage outfits and hairstyles, and weapon finishes. Buy before 20 November to get it."]}, {"c": "b", "q": ["বক্সড কপি কেনার লাভ কী, যদি ডিস্কই না থাকে?", "What is the point of a boxed copy with no disc?"], "a": ["বক্সে শুধু ডিজিটাল কোড থাকে। কোডটা একবারই রিডিম করা যায়। কিছু দোকান ছাড় বা বান্ডেল দিতে পারে, কিন্তু ডাউনলোডের জন্য ইন্টারনেট লাগবেই। ডিস্কবিহীন কনসোলেও এটা চলে, কারণ ডিজিটাল ভার্সন নামে।", "The box holds only a digital code, redeemable once. Some shops may offer discounts or bundles, but you still need internet to download. It also works on disc-less consoles since it installs the digital version."]}, {"c": "b", "q": ["বক্সড কপি কবে হাতে পাব?", "When do boxed copies arrive?"], "a": ["রিপোর্ট অনুযায়ী বক্সড কপি ১২ নভেম্বর থেকে পৌঁছাতে শুরু করে, যাতে কোড রিডিম করে আগেই প্রি-লোড করা যায়। বাংলাদেশে সরবরাহ আলাদা হতে পারে, তাই বিক্রেতার সাথে কথা বলুন।", "Reports say boxed copies start shipping from 12 November so buyers can redeem and preload early. Supply in Bangladesh may differ, so ask your seller."]}, {"c": "b", "q": ["বিদেশ থেকে PS5 কোড আনলে কী ঝুঁকি?", "What is the risk of importing a PS5 code?"], "a": ["কোডের অঞ্চল আপনার PSN অ্যাকাউন্টের অঞ্চলের সাথে না মিললে রিডিম হবে না। সবচেয়ে নিরাপদ হলো নিজের অ্যাকাউন্টের অঞ্চলের স্টোর থেকে ডিজিটাল কেনা, কারণ তখন অঞ্চল নিজে থেকেই মেলে।", "If the code’s region does not match your PSN account region it will not redeem. The safest route is buying digitally from your own account’s store, since the region matches automatically."]}, {"c": "b", "q": ["জাপানের কোডের মেয়াদ নাকি শেষ হয়ে যায়?", "Do codes really expire in Japan?"], "a": ["রকস্টারের তথ্য অনুযায়ী জাপানে বিক্রি হওয়া PS5 ডিজিটাল কোড লঞ্চের ১৭০ দিন পর মেয়াদ হারায়। অন্য অঞ্চলের জন্য এমন কিছু আমরা পাইনি।", "Per Rockstar, PS5 digital codes sold in Japan expire 170 days after launch. We found nothing like this for other regions."]}, {"c": "b", "q": ["আল্টিমেট এডিশন কি শুধু ডিজিটাল? স্ট্যান্ডার্ড থেকে আপগ্রেড করা যায়?", "Is Ultimate digital-only? Can I upgrade from Standard?"], "a": ["রিপোর্ট অনুযায়ী আল্টিমেট শুধু ডিজিটাল। স্ট্যান্ডার্ড কিনলে পরে আলাদাভাবে আল্টিমেট আপগ্রেড কেনা যায় বলেও রিপোর্ট আছে। কেনার আগে স্টোরের পেজে মিলিয়ে নিন।", "Reports say Ultimate is digital-only, and that Standard owners can buy the Ultimate upgrade separately. Confirm on your store page before buying."]}, {"c": "b", "q": ["GTA+ এক মাস ফ্রি পাওয়া যায় কি?", "Do I get a free month of GTA+?"], "a": ["রিপোর্ট অনুযায়ী যোগ্য ডিজিটাল অর্ডারের সাথে এক মাসের GTA+ সদস্যতা মেলে, আর ১৯ নভেম্বরের মধ্যে কিনলে Vintage Vice City Pack-ও থাকে। এটা অঞ্চলভেদে আলাদা হতে পারে।", "Reports say qualifying digital orders include one month of GTA+, and buying by 19 November also adds the Vintage Vice City Pack. This may vary by region."]}, {"c": "b", "q": ["গেমটা কিনতে PS5 লাগবেই, নাকি আগে PS Plus লাগবে?", "Do I need PS Plus to play?"], "a": ["সিঙ্গেল-প্লেয়ার গল্পের জন্য PS Plus লাগার কোনো তথ্য আমরা পাইনি। তবে ডাউনলোড ও অ্যাক্টিভেশনের জন্য ইন্টারনেট লাগে। পরে কিছু বদলালে স্টোর পেজ দেখে নিন।", "We found no sign that PS Plus is needed for the single-player story. You do need internet for the download and activation. Check the store page if anything changes."]}, {"c": "t", "q": ["কত জিবি জায়গা লাগবে?", "How much storage do I need?"], "a": ["রকস্টার নিশ্চিত করেছে প্রায় ২১২ জিবি। লঞ্চের আগে ও পরে ছোট প্যাচ এসেছে, তাই বাড়তি কয়েক জিবি রাখুন। কিছু স্টোর লিস্টিংয়ে বেশি সংখ্যা (যেমন ২৪৪ জিবি) দেখা গেছে, কারণ আমরা নিশ্চিত করতে পারিনি।", "Rockstar confirmed about 212 GB. Small patches arrived before and after launch, so keep a few GB spare. Some store listings show higher numbers (such as 244 GB); we could not confirm why."]}, {"c": "t", "q": ["ইন্টারনেট ছাড়া খেলা যাবে?", "Can I play without internet?"], "a": ["রিপোর্ট অনুযায়ী সিঙ্গেল-প্লেয়ার স্টোরি ডাউনলোড, ইনস্টল ও অ্যাক্টিভেশনের পর অফলাইনে খেলা যাবে বলে ধরা হয়। তবে ডাউনলোড, আপডেট ও ক্লাউড সেভের জন্য ইন্টারনেট লাগবে।", "Reports say the single-player story is intended to work offline after download, install and activation. Downloads, updates and cloud saves still need internet."]}, {"c": "t", "q": ["কেনার পর কি একবার অনলাইন চেক লাগবে?", "Is there a one-time online check?"], "a": ["একটি রিপোর্ট অনুযায়ী ডিজিটাল কেনার পর লাইসেন্স যাচাইয়ের জন্য একবার অনলাইন চেক লাগে, তারপর আর লাগে না। ৩০ দিন পরপর চেকের গুজব ভুল প্রমাণিত হয়েছে বলে জানা গেছে।", "One report says a one-time online licence check is needed after a digital purchase, then no more. A rumoured 30-day check was reportedly not real."]}, {"c": "t", "q": ["PS5 Pro-তে কি বিশেষ উন্নতি আছে?", "Are there PS5 Pro enhancements?"], "a": ["রিপোর্ট অনুযায়ী সনি PS5 Pro-র জন্য উন্নতির কথা নিশ্চিত করেছে। তবে কী ধরনের উন্নতি বা ফ্রেমরেট কত, তা এখনো অনুমান।", "Reports say Sony has confirmed PS5 Pro enhancements. What they are, and the frame rate, is still speculation."]}, {"c": "t", "q": ["USB বা এক্সটার্নাল হার্ডডিস্কে রেখে খেলা যাবে?", "Can I play from a USB or external hard drive?"], "a": ["না। PS5 ও Xbox Series X|S-এর এই গেম চালাতে হবে কনসোলের ইন্টারনাল SSD বা সমর্থিত এক্সপ্যানশন স্টোরেজ থেকে। USB ড্রাইভ শুধু অন্য গেম জমিয়ে রাখার কাজে লাগে, চালানোর জন্য নয়।", "No. The game must run from the console’s internal SSD or supported expansion storage. A USB drive only archives other games, it cannot run this one."]}, {"c": "t", "q": ["PS5-এ বাড়তি স্টোরেজ কীভাবে বাড়াব?", "How do I add storage on PS5?"], "a": ["PS5-এ কনসোলের এক্সপ্যানশন স্লটে সামঞ্জস্যপূর্ণ M.2 NVMe SSD (হিটসিঙ্কসহ) বসাতে হয়। কেনার আগে সনির নির্দিষ্ট করা গতি ও আকার মিলিয়ে নিন।", "On PS5, install a compatible M.2 NVMe SSD with a heatsink in the expansion slot. Check Sony’s speed and size requirements before buying."]}, {"c": "t", "q": ["Xbox-এ স্টোরেজ বাড়ানোর উপায় কী?", "How do I add storage on Xbox?"], "a": ["Xbox Series X|S-এ লাইসেন্সপ্রাপ্ত Storage Expansion Card পেছনের স্লটে লাগাতে হয়। সাধারণ USB ড্রাইভ থেকে এই গেম চলে না।", "On Xbox Series X|S use a licensed Storage Expansion Card in the rear slot. A regular USB drive will not run this game."]}, {"c": "t", "q": ["PS5-এ ১ টেরাবাইটের মধ্যে আসলে কতটা জায়গা পাই?", "How much of a 1 TB PS5 is actually usable?"], "a": ["একটি হিসাব অনুযায়ী সিস্টেম ফাইল বাদে ব্যবহারযোগ্য জায়গা প্রায় ৬৬৭ জিবি। তাই ২১২ জিবির গেম নিলে প্রায় তিন ভাগের একভাগ চলে যায়। এটা আনুমানিক হিসাব, রকস্টারের তথ্য নয়।", "One estimate puts usable space near 667 GB after system files, so a 212 GB game takes roughly a third. This is an estimate, not a Rockstar figure."]}, {"c": "t", "q": ["লম্বা সময় ধরে খেললে কনসোল কি গরম হবে?", "Will the console run hot?"], "a": ["রিপোর্টে বলা হয়েছে গেমটি কনসোলের প্রসেসরকে অনেক চাপ দেবে। তাই ভেন্ট পরিষ্কার রাখুন, কনসোল খোলা ও বাতাস চলাচলের জায়গায় রাখুন। এটা সাধারণ সতর্কতা, কোনো নিশ্চিত সমস্যা নয়।", "Reports say the game will push the processor hard. Keep vents clean and the console in an open, ventilated spot. This is general precaution, not a confirmed problem."]}, {"c": "p", "q": ["PS5-এর বাড়তি স্টোরেজ (M.2 SSD)", "Extra storage for PS5 (M.2 SSD)"], "a": ["২১২ জিবির গেমের সাথে অন্য গেমও রাখতে চাইলে ১ টিবি বা বেশি ভাবুন। PS5-এর এক্সপ্যানশন স্লটের জন্য হিটসিঙ্কসহ সামঞ্জস্যপূর্ণ M.2 NVMe SSD লাগে। কেনার আগে সনির নির্দিষ্ট গতি ও আকার মিলিয়ে নিন।", "If you want other games alongside a 212 GB title, think 1 TB or more. The PS5 expansion slot needs a compatible M.2 NVMe SSD with a heatsink. Check Sony’s speed and size requirements before buying."], "ic": "💾"}, {"c": "p", "q": ["Xbox-এর স্টোরেজ এক্সপ্যানশন কার্ড", "Xbox storage expansion card"], "a": ["Series X|S-এ লাইসেন্সপ্রাপ্ত Storage Expansion Card লাগে, সাধারণ USB ড্রাইভ থেকে এই গেম চলে না। বাংলাদেশে সহজে পাওয়া যায় কি না আগে দেখে নিন।", "Series X|S needs a licensed Storage Expansion Card; a regular USB drive will not run this game. Check availability in Bangladesh first."], "ic": "💽"}, {"c": "p", "q": ["কোন কন্ট্রোলার নেবেন?", "Which controller should you get?"], "a": ["PS5-এর জন্য DualSense, Xbox-এর জন্য Xbox Wireless Controller নিরাপদ বেছে নেওয়া। অন্য ব্র্যান্ড কেনার আগে পণ্যের পেজে PS5/Xbox সামঞ্জস্য আছে কি না দেখুন, কারণ অনেক কন্ট্রোলার শুধু PC, Switch বা মোবাইলের।", "DualSense for PS5 and the Xbox Wireless Controller for Xbox are the safe picks. For other brands, check that the product page lists PS5/Xbox support, since many controllers are for PC, Switch or mobile only."], "ic": "🎮"}, {"c": "p", "q": ["কন্ট্রোলার চার্জিং স্ট্যান্ড", "Controller charging stand"], "a": ["লঞ্চের রাতে লম্বা সেশনে কন্ট্রোলারের চার্জ শেষ হওয়া ঠেকাতে একটা চার্জিং স্ট্যান্ড কাজে লাগে। নিজের কন্ট্রোলারের মডেলের সাথে মিল দেখে নিন।", "A charging stand helps stop your controller dying during a long launch-night session. Make sure it matches your controller model."], "ic": "🔋"}, {"c": "p", "q": ["গেমিং হেডসেট", "Gaming headset"], "a": ["রাতে আওয়াজ কমিয়ে খেলতে চাইলে PS5/Xbox-এ চলে এমন হেডসেট নিন। ওয়্যারলেস নিলে কনসোলের সাথে সংযোগের পদ্ধতি (ডঙ্গল, ব্লুটুথ বা কেবল) দেখে নিন।", "For quieter late-night play, pick a headset that works on PS5/Xbox. If it is wireless, check how it connects to the console (dongle, Bluetooth or cable)."], "ic": "🎧"}];

    var nt = document.createElement('div'); nt.className = 'lwnote'; nt.textContent = 'অনলাইনে ও খেলোয়াড়দের আলোচনায় যে প্রশ্নগুলো বেশি ঘুরছে, তার সংকলন। এগুলো দর্শকদের পাঠানো প্রশ্ন নয়। তথ্য হালনাগাদ: ২০ নভেম্বর ২০২৬।'; box.appendChild(nt);
    lw.forEach(function(it){
      var c2 = document.createElement('div'); c2.className = 'card';
      var h3 = document.createElement('h2'); h3.textContent = it.q; var p3 = document.createElement('p'); p3.textContent = it.a;
      c2.appendChild(h3); c2.appendChild(p3); box.appendChild(c2);
    });
    n += lw.length;
  }
  $('none').textContent = q ? U[lang].none : t.noWeek; $('none').style.display = n ? 'none' : 'block';
  $('cnt').textContent = nz(n) + t.cnt;
}
function askText(){
  var t = W[lang];
  $('askBtn').textContent = t.askBtn; $('askBtn').className = 'askbtn' + (askOpen ? ' on' : ''); $('askT').textContent = t.askT; $('askS').textContent = t.askS;
  $('askTa').placeholder = t.askPh; if(!$('askSend').disabled) $('askSend').textContent = t.askSend;
}
function askMsg(txt, bad){ var m = $('askMsg'); m.textContent = txt; m.className = 'askmsg' + (bad ? ' err' : ''); }

function cb(){
  var ms = LAUNCH.getTime() - Date.now(), t = U[lang];
  if(ms <= 0){ $('cbS').textContent = t.live; return; }
  var s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600);
  $('cbS').textContent = nz(d) + ' ' + t.d + ' ' + nz(h) + ' ' + t.h + t.left;
}

function render(){
  var t = U[lang], q = $('q').value.trim().toLowerCase(), box = $('cards'), n = 0;
  box.innerHTML = '';
  $('askBox').style.display = askOpen ? 'block' : 'none';
  if(askOpen){ $('none').style.display = 'none'; $('cnt').textContent = ''; return; }
  if(flt === 'w'){ renderWeekly(q); return; }
  QA.forEach(function(it){
    if(flt !== 'all' && it.c !== flt) return;
    var qq = it.q[lang === 'bn' ? 0 : 1], aa = it.a[lang === 'bn' ? 0 : 1];
    if(q && (qq + ' ' + aa).toLowerCase().indexOf(q) < 0) return;
    n++;
    var c = document.createElement('div'); c.className = 'card';
    if(it.c === 'v'){ var g = document.createElement('div'); g.className = 'tag'; g.textContent = '🔥 ' + t.viral; c.appendChild(g); }
    var h = document.createElement('h2'); h.textContent = (it.ic ? it.ic + ' ' : '') + qq;
    var p = document.createElement('p'); p.textContent = aa;
    var m = document.createElement('div'); m.className = 'meta';
    var d = document.createElement('span'); d.textContent = t.chk + CHECKED[lang]; m.appendChild(d);
    if(it.link && it.link.u){
      var a = document.createElement('a'); a.className = 'prod'; a.href = it.link.u; a.target = '_blank'; a.rel = 'noopener sponsored';
      a.textContent = it.link.t[lang === 'bn' ? 0 : 1]; m.appendChild(a);
    } else if(it.c === 'p'){
      var so = document.createElement('span'); so.textContent = t.soon; m.appendChild(so);
    }
    c.appendChild(h); c.appendChild(p); c.appendChild(m); box.appendChild(c);
  });
  $('none').style.display = n ? 'none' : 'block';
  $('cnt').textContent = nz(n) + t.n;
}

var CATS = [["all","সব","All"],["v","🔥 ভাইরাল","🔥 Viral"],["w","📅 সাপ্তাহিক উত্তর","📅 Weekly answers"],["l","লঞ্চ গাইড","Launch guide"],["g","গেমপ্লে ও গল্প","Gameplay & story"],["b","কেনা ও এডিশন","Buying & editions"],["t","টেক ও স্টোরেজ","Tech & storage"],["p","🛒 গেমিং গিয়ার","🛒 Gaming gear"]];
function chips(){
  var box = $('chips'); box.innerHTML = '';
  CATS.forEach(function(c){
    var n = c[0] === 'all' ? QA.length : c[0] === 'w' ? (WK.length + LW.length) : QA.filter(function(x){ return x.c === c[0]; }).length;
    var b = document.createElement('button');
    b.textContent = c[lang === 'bn' ? 1 : 2] + (' ' + nz(n));
    b.className = (!askOpen && flt === c[0]) ? 'on' : '';
    b.onclick = function(){ askOpen = false; flt = c[0]; if(flt === 'w') loadWeekly(); text(); };
    box.appendChild(b);
  });
}
function text(){
  var t = U[lang];
  document.documentElement.lang = lang;
  $('h1').innerHTML = t.h1; $('sub').textContent = t.sub; $('q').placeholder = t.ph;
  chips(); askText();
  $('none').textContent = t.none; $('cbT').textContent = t.cbT; $('aff').textContent = t.aff; $('fan').textContent = t.fan;
  $('bn').className = lang === 'bn' ? 'on' : ''; $('en').className = lang === 'en' ? 'on' : '';
    render(); cb();
}

$('bn').onclick = function(){ lang = 'bn'; try{ localStorage.setItem('nga_lang', lang); }catch(e){} text(); };
$('en').onclick = function(){ lang = 'en'; try{ localStorage.setItem('nga_lang', lang); }catch(e){} text(); };
$('q').addEventListener('input', function(){ if(askOpen){ askOpen = false; text(); } else render(); });
$('askBtn').onclick = function(){ askOpen = !askOpen; text(); if(askOpen) $('askBox').scrollIntoView({behavior:'smooth', block:'start'}); };
$('askX').onclick = function(){ askOpen = false; text(); };
$('askTa').addEventListener('input', function(){ $('askCnt').textContent = nz(this.value.length) + '/' + nz(400); });
$('askSend').onclick = function(){
  var t = W[lang], v = $('askTa').value.trim(), btn = $('askSend');
  if(v.length < 10){ askMsg(t.askErrShort, true); return; }
  if(/https?:|www\./i.test(v)){ askMsg(t.askErrLink, true); return; }
  btn.disabled = true; btn.textContent = t.askSending; askMsg('', false);
  fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text: v, lang: lang, website: $('askHp').value})})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return {s: r.status, d: d}; }); })
    .then(function(x){
      var t2 = W[lang];
      if(x.s === 200){ $('askTa').value = ''; $('askCnt').textContent = nz(0) + '/' + nz(400); askMsg(t2.askOk, false); }
      else if(x.s === 429){ askMsg(t2.askErrRate, true); }
      else if(x.d && x.d.error === 'short'){ askMsg(t2.askErrShort, true); }
      else if(x.d && x.d.error === 'link'){ askMsg(t2.askErrLink, true); }
      else { askMsg(t2.askErrNet, true); }
    })
    .catch(function(){ askMsg(W[lang].askErrNet, true); })
    .then(function(){ btn.disabled = false; btn.textContent = W[lang].askSend; });
};
if(COUNTDOWN_URL){ var b = $('cb'); b.href = COUNTDOWN_URL; b.className = 'cb on'; }
if(location.hash === '#gear') flt = 'p';
if(location.hash === '#ask') askOpen = true;
if(location.hash === '#weekly') flt = 'w';
if(flt === 'w') loadWeekly();
text(); setInterval(cb, 30000);
</script>
<script>
(function(){
  var sp=document.getElementById('splash'); if(!sp) return;
  var root=document.documentElement, dur=/\btin\b/.test(root.className)?150:1100;
  function hide(){ sp.classList.remove('go'); sp.classList.add('hide'); try{sessionStorage.setItem('nga_s','1')}catch(e){} }
  if(!/\bnosplash\b/.test(root.className)) setTimeout(hide, dur); else sp.classList.add('hide');
  window.addEventListener('pageshow',function(e){ if(e.persisted) hide(); });
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    var a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
    var h=a.getAttribute('href'); if(!h||h.charAt(0)==='#'||a.target==='_blank'||a.hasAttribute('download')) return;
    var u; try{u=new URL(a.href,location.href)}catch(x){return}
    if(u.origin!==location.origin) return;
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    e.preventDefault();
    try{sessionStorage.setItem('nga_t','1')}catch(x){}
    sp.classList.remove('hide'); sp.classList.add('go'); void sp.offsetWidth;
    setTimeout(function(){ location.href=u.href; }, 480);
  });
})();
</script>
