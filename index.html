.since{margin-top:auto;width:100%;background:rgba(10,3,30,.74);border:1px solid rgba(124,92,255,.6);border-radius:18px;padding:12px 10px}
.since .lb{font-size:12.5px;color:#d6c8ff;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid b{display:block;font-size:clamp(26px,8vw,40px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}.grid span{font-size:12px;color:var(--mute)}
.hbtn{display:flex;gap:10px;margin-top:14px;width:100%}.hbtn a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:15px;padding:13px 8px;border-radius:14px;color:#fff}
.hbtn .p{background:linear-gradient(90deg,var(--a),var(--b))}.hbtn .g{background:rgba(10,3,30,.74);border:1px solid var(--b)}
.wrap{max-width:640px;margin:0 auto;padding:6px 16px 140px}
h2{font-size:19px;margin:26px 2px 12px}
.news{display:grid;gap:10px}
.nc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.nc .nh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.nc b{font-size:16px;line-height:1.4}.nc .tg{flex:none;font-size:11px;font-weight:600;color:#fff;background:rgba(124,92,255,.35);border-radius:999px;padding:2px 10px}
.nc p{margin:0;font-size:14.5px;color:#dcdcf0}
.upd{font-size:12px;color:var(--mute);margin:10px 2px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center}
.tile i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}.tile b{font-size:15px}
.gear{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:16px;color:#fff;text-decoration:none;background:linear-gradient(135deg,rgba(255,61,129,.2),rgba(124,92,255,.3));border:1px solid rgba(124,92,255,.75)}
.gi{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--a),var(--b))}.gt{flex:1;min-width:0}.gt b{display:block;font-size:15.5px;line-height:1.35}.gt span{display:block;font-size:12.5px;color:#d6d6ee}.gt em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:3px}.go{flex:none;font-size:13px;font-weight:600;background:#fff;color:#1a1033;border-radius:999px;padding:7px 13px;white-space:nowrap}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer;user-select:none}
.list li .ck{flex:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-size:14px;color:transparent}.list li.on{color:var(--mute);text-decoration:line-through}.list li.on .ck{background:var(--b);border-color:var(--b);color:#fff}
.prog{text-align:center;color:var(--mute);font-size:13px;margin-top:4px}
.cta{display:block;text-align:center;padding:15px;border-radius:14px;font-weight:800;font-size:17px;color:#fff;text-decoration:none;background:linear-gradient(90deg,var(--a),var(--b))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:22px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,rgba(11,11,18,0))}.dock .cta{max-width:640px;margin:0 auto;box-shadow:0 6px 24px rgba(124,92,255,.45)}
footer{margin-top:26px;text-align:center;color:var(--mute);font-size:11.5px;line-height:1.7}

#splash{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:9999;display:grid;place-items:center;background:#00032a;overflow:hidden;transition:opacity .45s ease,visibility .45s}#splash::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 42%,rgba(124,92,255,.32),rgba(0,3,42,0) 62%)}.sp-box{position:relative}#splash.hide{opacity:0;visibility:hidden}#splash.go{transition-duration:.2s}.nosplash #splash:not(.go){opacity:0;visibility:hidden;transition:none}.tin #splash{transition-duration:.25s}.sp-box{display:flex;flex-direction:column;align-items:center}.sp-box .lg{width:96px;height:96px;border-radius:24px;box-shadow:0 0 48px rgba(124,92,255,.65);animation:sp-in .8s cubic-bezier(.2,.9,.3,1.2) both}#splash.go .lg{animation-duration:.45s}.tin .sp-box .lg{animation:none}.sp-name{margin-top:18px;color:#f2f2f7;font-weight:800;letter-spacing:.5px;font-size:18px;opacity:0;animation:sp-fade .5s ease .4s forwards}.tin .sp-name{animation:none;opacity:1}@keyframes sp-in{0%{opacity:0;transform:scale(.4) rotate(-14deg)}60%{opacity:1;transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes sp-fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.sp-box .lg,.sp-name{animation:none;opacity:1}}
</style>
</head>

var BN = '০১২৩৪৫৬৭৮৯';
function bd(n){ return String(n).replace(/\d/g, function(c){ return BN.charAt(c); }); }
function nz(n){ return lang === 'bn' ? bd(n) : String(n); }
function $(id){ return document.getElementById(id); }
function load(){ try{ var l = localStorage.getItem('nga_lang'); if(l === 'bn' || l === 'en') lang = l; var c = JSON.parse(localStorage.getItem('nga_chk2') || 'null'); if(c && c.length === 4) checked = c; }catch(e){} }
function save(){ try{ localStorage.setItem('nga_lang', lang); localStorage.setItem('nga_chk2', JSON.stringify(checked)); }catch(e){} }
function renderList(){
  var t = T[lang], ul = $('list'), n = 0; ul.innerHTML = '';
  t.items.forEach(function(txt, i){
    var li = document.createElement('li'); if(checked[i]){ li.className = 'on'; n++; }
    li.innerHTML = '<span class="ck">✓</span><span></span>'; li.lastChild.textContent = txt;
    li.onclick = function(){ checked[i] = !checked[i]; save(); renderList(); }; ul.appendChild(li);
  });
  $('prog').textContent = t.prog(n, 4);
}
function renderText(){
  var t = T[lang]; document.documentElement.lang = lang;
  $('liveT').textContent = t.live; $('hT').textContent = t.h; $('hS').textContent = t.hs; $('b1').textContent = t.b1; $('b2').textContent = t.b2;
  $('newsT').textContent = t.newsT; $('upd').textContent = t.upd; $('chkT').textContent = t.chkT; $('foot').textContent = t.foot; $('cta').textContent = t.cta;
  $('gearT').textContent = t.gearT; $('gearS').textContent = t.gearS; $('gearC').textContent = t.gearC; $('gearB').textContent = t.gearB;
  document.querySelectorAll('[data-k]').forEach(function(el){ var k = el.getAttribute('data-k'); el.textContent = t[k === 'h' ? 'hh' : k]; });
  var nb = $('news'); nb.innerHTML = '';
  t.news.forEach(function(n){
    var c = document.createElement('div'); c.className = 'nc';
    var h = document.createElement('div'); h.className = 'nh';
    var b = document.createElement('b'); b.textContent = n[0] + ' ' + n[1]; var g = document.createElement('span'); g.className = 'tg'; g.textContent = n[2];
    h.appendChild(b); h.appendChild(g); var p = document.createElement('p'); p.textContent = n[3]; c.appendChild(h); c.appendChild(p); nb.appendChild(c);
  });
  var tl = $('tiles'); tl.innerHTML = '';
  t.tiles.forEach(function(x){ var a = document.createElement('a'); a.className = 'tile'; a.href = x[2]; a.innerHTML = '<i></i><b></b>'; a.firstChild.textContent = x[0]; a.lastChild.textContent = x[1]; tl.appendChild(a); });
  $('bn').className = lang === 'bn' ? 'on' : ''; $('en').className = lang === 'en' ? 'on' : '';
  renderList(); tick();
}
function tick(){
  var ms = Date.now() - LAUNCH.getTime(), t = T[lang]; $('sinceL').textContent = ms >= 0 ? t.since : t.until; ms = Math.abs(ms);
  var s = Math.floor(ms / 1000);
  $('d').textContent = nz(Math.floor(s / 86400)); $('h').textContent = nz(Math.floor(s % 86400 / 3600)); $('m').textContent = nz(Math.floor(s % 3600 / 60)); $('s').textContent = nz(s % 60);
}
$('bn').onclick = function(){ lang = 'bn'; save(); renderText(); };
$('en').onclick = function(){ lang = 'en'; save(); renderText(); };
load(); renderText(); setInterval(tick, 1000);

    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
