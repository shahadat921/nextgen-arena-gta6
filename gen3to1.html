<style>
:root{color-scheme:dark;--bg:#0b0b12;--card:#161622;--line:#2a2a3d;--text:#f2f2f7;--mute:#9a9ab0;--a:#ff3d81;--b:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(600px 300px at 50% -60px,rgba(124,92,255,.22),transparent),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;line-height:1.55}
.bar{background:#00032a;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(124,92,255,.35)}
.barin{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{height:40px;width:auto;display:block}
.acts{display:flex;gap:8px}
.ib{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 70px}
.login{text-align:center;margin-top:34px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 20px}
.login .lk{font-size:38px}.login h1{font-size:20px;margin:6px 0}.login p{color:var(--mute);font-size:14px;margin:0 0 16px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:12px;outline:none}
textarea{resize:vertical}input:focus,textarea:focus{border-color:var(--b)}
.pri{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-size:15px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b))}
.login .pri{width:100%;margin-top:12px}
.pri:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:26px;line-height:1.2;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.st span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin:18px 0 14px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:10px 6px;border-radius:10px;cursor:pointer}
.tabs button.on{background:rgba(124,92,255,.28);color:#fff}
.tabs i{font-style:normal;font-size:12px;background:rgba(255,255,255,.1);border-radius:999px;padding:1px 8px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--mute)}
.badge{background:rgba(124,92,255,.22);color:#cfc6ff;border-radius:999px;padding:2px 10px;font-weight:600}
.lbl{display:block;font-size:12px;color:var(--mute);margin:10px 0 6px}
.row{display:flex;gap:10px;margin-top:14px}.row .pri{flex:1}
.dng{background:transparent;border:1px solid #6b2236;color:#ffb3c2;border-radius:12px;padding:12px 16px;font:inherit;font-size:14px;cursor:pointer}
.gh{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
.pq{font-weight:700;font-size:16px;margin:0 0 8px}
.pa{margin:0;padding-left:12px;border-left:3px solid var(--b);color:#dcdcf0;white-space:pre-wrap}
.empty{text-align:center;color:var(--mute);padding:34px 10px;border:1px dashed var(--line);border-radius:16px}
.empty div{font-size:32px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1d1d30;border:1px solid var(--b);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:#ff5d7f;color:#ffc2cf}
</style>
</head>

<script>
var KEY = '';
try{ KEY = sessionStorage.getItem('nga_k') || ''; }catch(e){}
var BN = '০১২৩৪৫৬৭৮৯', MO = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function $(i){ return document.getElementById(i); }
function bn(n){ return String(n).replace(/\d/g, function(c){ return BN.charAt(c); }); }
function fmt(ts){ var d = new Date(ts); function z(n){ return ('0' + n).slice(-2); } return bn(d.getDate()) + ' ' + MO[d.getMonth()] + ' ' + bn(d.getFullYear()) + ', ' + bn(z(d.getHours())) + ':' + bn(z(d.getMinutes())); }
function mk(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt !== undefined) e.textContent = txt; return e; }
var tt;
function toast(t, bad){ var el = $('toast'); el.textContent = t; el.className = 'toast show' + (bad ? ' err' : ''); clearTimeout(tt); tt = setTimeout(function(){ el.className = 'toast' + (bad ? ' err' : ''); }, 2800); }
function api(body){
  return fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json','x-admin-key':KEY}, body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return {s:r.status, d:d}; }); });
}
function showLogin(){ $('login').style.display = 'block'; $('panel').style.display = 'none'; $('acts').style.display = 'none'; }
function tab(n){ $('t1').className = n === 1 ? 'on' : ''; $('t2').className = n === 2 ? 'on' : ''; $('list1').style.display = n === 1 ? 'block' : 'none'; $('list2').style.display = n === 2 ? 'block' : 'none'; }

function load(){
  api({action:'list'}).then(function(x){
    if(x.s === 401){ toast('পাসওয়ার্ড ভুল।', true); showLogin(); return; }
    if(x.s === 429){ toast('অনেকবার ভুল চেষ্টা। ১৫ মিনিট পরে আবার চেষ্টা করুন।', true); showLogin(); return; }
    if(x.s !== 200){ toast('সার্ভারে সমস্যা (' + (x.d.error || x.s) + ')', true); showLogin(); return; }
    $('login').style.display = 'none'; $('panel').style.display = 'block'; $('acts').style.display = 'flex';
    draw(x.d.questions || [], x.d.answers || []);
  }).catch(function(){ toast('ইন্টারনেট সমস্যা।', true); });
}

function draw(qs, as){
  var week = as.filter(function(a){ return Date.now() - a.ts < 7 * 86400000; }).length;
  $('s1').textContent = bn(qs.length); $('s2').textContent = bn(as.length); $('s3').textContent = bn(week);
  $('c1').textContent = bn(qs.length); $('c2').textContent = bn(as.length);
  var l1 = $('list1'); l1.innerHTML = '';
  if(!qs.length){ var e1 = mk('div','empty'); e1.appendChild(mk('div',null,'📭')); e1.appendChild(mk('span',null,'এখন কোনো নতুন প্রশ্ন নেই।')); l1.appendChild(e1); }
  qs.forEach(function(q){
    var c = mk('div','card'), ch = mk('div','ch');
    ch.appendChild(mk('span','badge', q.lang === 'en' ? 'English' : 'বাংলা')); ch.appendChild(mk('span',null, fmt(q.ts))); c.appendChild(ch);
    c.appendChild(mk('label','lbl','প্রশ্ন (দরকার হলে ঠিক করুন)'));
    var qt = mk('textarea'); qt.rows = 2; qt.value = q.text; c.appendChild(qt);
    c.appendChild(mk('label','lbl','আপনার উত্তর'));
    var at = mk('textarea'); at.rows = 4; at.placeholder = 'উত্তর লিখুন...'; c.appendChild(at);
    var row = mk('div','row'), pub = mk('button','pri','✅ প্রকাশ করুন'), del = mk('button','dng','🗑 মুছুন');
    pub.type = 'button'; del.type = 'button';
    pub.onclick = function(){
      if(at.value.trim().length < 2){ toast('আগে উত্তর লিখুন।', true); return; }
      pub.disabled = true;
      api({action:'publish', id:q.id, question:qt.value, answer:at.value}).then(function(x){
        if(x.s === 200){ toast('প্রকাশ হয়েছে ✅'); load(); } else { toast('প্রকাশ করা যায়নি (' + (x.d.error || x.s) + ')', true); pub.disabled = false; }
      });
    };
    del.onclick = function(){ if(!confirm('প্রশ্নটি মুছে ফেলবেন?')) return; api({action:'delete', id:q.id}).then(function(){ toast('মুছে ফেলা হয়েছে'); load(); }); };
    row.appendChild(pub); row.appendChild(del); c.appendChild(row); l1.appendChild(c);
  });
  var l2 = $('list2'); l2.innerHTML = '';
  if(!as.length){ var e2 = mk('div','empty'); e2.appendChild(mk('div',null,'🗂')); e2.appendChild(mk('span',null,'এখনো কিছু প্রকাশ হয়নি।')); l2.appendChild(e2); }
  as.forEach(function(a){
    var c = mk('div','card'), ch = mk('div','ch');
    ch.appendChild(mk('span','badge','প্রকাশিত')); ch.appendChild(mk('span',null, fmt(a.ts))); c.appendChild(ch);
    c.appendChild(mk('p','pq', a.q)); c.appendChild(mk('p','pa', a.a));
    var row = mk('div','row'), un = mk('button','gh','প্রকাশ সরান'); un.type = 'button';
    un.onclick = function(){ if(!confirm('উত্তরটি সাইট থেকে সরাবেন?')) return; api({action:'unpublish', id:a.id}).then(function(){ toast('সরানো হয়েছে'); load(); }); };
    row.appendChild(un); c.appendChild(row); l2.appendChild(c);
  });
}
$('t1').onclick = function(){ tab(1); }; $('t2').onclick = function(){ tab(2); };
$('go').onclick = function(){ KEY = $('key').value; try{ sessionStorage.setItem('nga_k', KEY); }catch(e){} load(); };
$('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('go').click(); });
$('refresh').onclick = function(){ load(); toast('রিফ্রেশ হয়েছে'); };
$('out').onclick = function(){ KEY = ''; try{ sessionStorage.removeItem('nga_k'); }catch(e){} $('key').value = ''; showLogin(); };
if(KEY) load();
</script>
</body>
</html>
